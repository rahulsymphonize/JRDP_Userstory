# Production-shaped local stack. Put a TLS-terminating proxy in front of api
# and ui for real use.
x-db: &db-env
  DATABASE_URL: postgresql+psycopg://agent:${POSTGRES_PASSWORD}@db:5432/agent

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agent
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: python -m backend.manage migrate
    env_file: .env
    environment: *db-env
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment: *db-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/readyz')
      interval: 10s

  ui:
    build: frontend
    environment:
      LLM_AGENT_API: http://api:8000/api/v1
      LLM_AGENT_AUTH: ${AUTH_MODE:-oidc}
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:

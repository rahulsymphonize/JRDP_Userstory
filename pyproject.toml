[project]
name = "jrdp-userstory"
version = "0.1.0"
requires-python = ">=3.12"
# keep in step with requirements.txt (used by the Dockerfile)
dependencies = [
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pyjwt[crypto]==2.15.1",
]

[tool.vercel]
entrypoint = "backend.main:app"

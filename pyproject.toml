[project]
name = "jrdp-userstory"
version = "0.1.0"
requires-python = ">=3.12"
# keep in step with requirements.txt and frontend/requirements.txt (used by the Dockerfiles)
dependencies = [
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pyjwt[crypto]==2.15.1",
    "streamlit==1.66.0",
    "websockets==17.3",  # WebSocket transport for the Streamlit UI on Vercel
]

[tool.vercel]
entrypoint = "asgi:app"
